name = "api-worker"
main = "src/index.ts"
compatibility_date = "2026-02-14"

[vars]
CORS_ORIGIN = "http://localhost:5173"
PROXY_RETRY_ROUNDS = "2"
PROXY_RETRY_DELAY_MS = "200"

[triggers]
# 03:17 UTC：rollup 昨日 → 分批清理过期原始日志/会话/rollup/channel_probes（+ 可选用量日报在链尾）
# 每 5 分钟：渠道失败率报警评估（services/alerts.ts evaluateAlerts）
#           + 渠道主动健康探测到期判定（services/channel-probe.ts runChannelProbes；默认全关零行为）
crons = ["17 3 * * *", "*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "api-worker"
database_id = "00000000-0000-0000-0000-000000000000"

[assets]
directory = "../ui/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true



